services:
  petition-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: academic-petition-api

    ports:
      - "8000:8000"

    environment:
      PYTHONUNBUFFERED: "1"
      HF_HOME: /app/.cache/huggingface

    volumes:
      - petition_logs:/app/logs
      - huggingface_cache:/app/.cache/huggingface

    restart: unless-stopped

volumes:
  petition_logs:
  huggingface_cache: